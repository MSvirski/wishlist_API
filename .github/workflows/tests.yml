name: Integration Tests (Pytest)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db-test:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qwerty123
          POSTGRES_DB: pet_wishlist_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pet_wishlist_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio asyncpg

      - name: Run Pytest
        env:
          # Переопределяем хост: на GitHub база доступна по адресу localhost
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:qwerty123@localhost:5432/pet_wishlist_test_db
          DB_CONNECTION_STRING: postgresql+asyncpg://postgres:maks123@localhost:5432/pet_wishlist_db
        run: pytest -v
